services:
  # ── PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uptimemonitor-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptimemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-uptimemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptimemonitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptimemonitor} -d ${POSTGRES_DB:-uptimemonitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Mailpit (local email testing) ──────────────────────
  # Web UI:  http://localhost:8025
  # SMTP:    localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    container_name: uptimemonitor-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  # ── API Service (Spring Boot) ──────────────────────────
  api-service:
    build:
      context: ./services
      dockerfile: api-service/Dockerfile
    container_name: uptimemonitor-api-service
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uptimemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-uptimemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptimemonitor}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_SERVICE_URL: ${API_SERVICE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Monitor Worker (Spring Boot) ───────────────────────
  monitor-worker:
    build:
      context: ./services
      dockerfile: monitor-worker/Dockerfile
    container_name: uptimemonitor-monitor-worker
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uptimemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-uptimemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptimemonitor}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@uptimemonitor.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Frontend (Next.js) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: uptimemonitor-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

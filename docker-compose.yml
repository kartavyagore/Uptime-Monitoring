version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uptimemonitor-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptimemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-uptimemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptimemonitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptimemonitor} -d ${POSTGRES_DB:-uptimemonitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Mailpit (local email testing) ──────────────────────
  # Web UI:  http://localhost:8025
  # SMTP:    localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    container_name: uptimemonitor-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

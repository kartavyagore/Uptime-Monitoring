<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Monitor Recovered</title>
</head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background-color:#f4f4f7;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;padding:24px;">
    <tr>
        <td style="background:#16a34a;border-radius:12px 12px 0 0;padding:32px 24px;text-align:center;">
            <h1 style="color:#fff;margin:0;font-size:24px;">🟢 Monitor Recovered</h1>
        </td>
    </tr>
    <tr>
        <td style="background:#fff;padding:32px 24px;border:1px solid #e5e7eb;border-top:none;">
            <h2 style="margin:0 0 16px 0;color:#111827;" th:text="${monitorName}">Monitor Name</h2>

            <table cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;">
                <tr>
                    <td style="color:#6b7280;font-weight:600;width:140px;">Endpoint</td>
                    <td style="color:#111827;word-break:break-all;" th:text="${endpoint}">https://example.com</td>
                </tr>
                <tr th:if="${httpStatus != null}">
                    <td style="color:#6b7280;font-weight:600;">HTTP Status</td>
                    <td style="color:#16a34a;font-weight:700;" th:text="${httpStatus}">200</td>
                </tr>
                <tr th:if="${responseTimeMs != null}">
                    <td style="color:#6b7280;font-weight:600;">Response Time</td>
                    <td style="color:#111827;" th:text="${responseTimeMs} + ' ms'">—</td>
                </tr>
                <tr>
                    <td style="color:#6b7280;font-weight:600;">Recovered At</td>
                    <td style="color:#111827;" th:text="${timestamp}">2026-01-01 00:00:00 UTC</td>
                </tr>
            </table>

            <div style="margin-top:24px;text-align:center;">
                <a th:href="${dashboardUrl}" style="display:inline-block;background:#2563eb;color:#fff;
                   padding:12px 32px;border-radius:8px;text-decoration:none;font-weight:600;">
                    View Dashboard
                </a>
            </div>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 24px;text-align:center;color:#9ca3af;font-size:12px;
                   border:1px solid #e5e7eb;border-top:none;border-radius:0 0 12px 12px;background:#f9fafb;">
            You received this email because notifications are enabled for this monitor.<br/>
            <a th:href="${dashboardUrl}" style="color:#6b7280;">Manage notification settings</a>
        </td>
    </tr>
</table>
</body>
</html>

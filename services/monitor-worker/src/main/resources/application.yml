server:
  port: 8083

spring:
  application:
    name: monitor-worker
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  # ── DataSource ─────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:uptimemonitor}
    username: ${POSTGRES_USER:uptimemonitor}
    password: ${POSTGRES_PASSWORD:uptimemonitor}
    driver-class-name: org.postgresql.Driver

  # ── JPA ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ── Flyway (API service manages migrations) ────────────
  flyway:
    enabled: false

  # ── Email / SMTP ───────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # ── Thymeleaf (email templates) ────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

# ── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# ── Application ────────────────────────────────────────────
app:
  mail:
    from: ${MAIL_FROM:noreply@uptimemonitor.dev}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  checker:
    connection-timeout-ms: 5000
    read-timeout-ms: 10000
    max-response-body-size: 1048576
    max-redirects: 5
    user-agent: "UptimeMonitor/1.0"
  scheduler:
    fixed-rate-ms: 15000
    initial-delay-ms: 10000

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    com.uptimemonitor: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
